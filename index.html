  ctx.moveTo(3, -h * 0.34); ctx.lineTo(3 - swing * 7, 0);
  ctx.stroke();

  ctx.fillStyle = d.body;
  roundRect(ctx, -w / 2, -h * 0.80, w, h * 0.48, 5); ctx.fill();
  ctx.fillStyle = d.trim;
  ctx.fillRect(-w / 2, -h * 0.58, w, 4);

  ctx.fillStyle = "#d9b48c";
  ctx.beginPath(); ctx.arc(0, -h * 0.88, w * 0.32, 0, 6.284); ctx.fill();
  ctx.fillStyle = d.trim;
  ctx.beginPath(); ctx.arc(0, -h * 0.90, w * 0.34, Math.PI, 0); ctx.fill();

  if (inv.type === "grunt") {
    ctx.strokeStyle = "#5a4632"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-w * 0.55, -h * 0.30); ctx.lineTo(-w * 0.75, -h * 0.85); ctx.stroke();
    ctx.fillStyle = "#8a8a90"; ctx.fillRect(-w * 0.92, -h * 1.02, 18, 14);
  } else if (inv.type === "climber") {
    ctx.strokeStyle = "#7a5a34"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-w * 0.1, -h * 1.02); ctx.lineTo(w * 0.95, -h * 0.62);
    ctx.moveTo(-w * 0.02, -h * 0.86); ctx.lineTo(w * 1.03, -h * 0.46);
    ctx.stroke();
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const t = i / 3;
      ctx.beginPath();
      ctx.moveTo(lerp(-w * 0.1, w * 0.95, t), lerp(-h * 1.02, -h * 0.62, t));
      ctx.lineTo(lerp(-w * 0.02, w * 1.03, t), lerp(-h * 0.86, -h * 0.46, t));
      ctx.stroke();
    }
  } else if (inv.type === "sapper") {
    const pulse = inv.state === "fuse" ? (0.5 + Math.sin(inv.fuse * 40) * 0.5) : 0.35;
    ctx.fillStyle = "#2e2a26";
    ctx.beginPath(); ctx.arc(-w * 0.55, -h * 0.5, 11, 0, 6.284); ctx.fill();
    ctx.fillStyle = `rgba(255,${140 + pulse * 100},60,${0.6 + pulse * 0.4})`;
    ctx.beginPath(); ctx.arc(-w * 0.55, -h * 0.68, 4 + pulse * 3, 0, 6.284); ctx.fill();
  } else if (inv.type === "warlord") {
    ctx.strokeStyle = "#d4b0ff"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-w * 0.6, -h * 0.2); ctx.lineTo(-w * 0.85, -h * 0.95); ctx.stroke();
    ctx.fillStyle = "#d4b0ff";
    ctx.beginPath();
    ctx.moveTo(-w * 0.34, -h * 0.98); ctx.lineTo(-w * 0.6, -h * 1.2); ctx.lineTo(-w * 0.2, -h * 1.03);
    ctx.moveTo(w * 0.34, -h * 0.98); ctx.lineTo(w * 0.6, -h * 1.2); ctx.lineTo(w * 0.2, -h * 1.03);
    ctx.fill();
    ctx.fillStyle = "rgba(90,60,140,0.85)";
    ctx.beginPath();
    ctx.moveTo(w * 0.35, -h * 0.78); ctx.lineTo(w * 0.85, -h * 0.1); ctx.lineTo(w * 0.2, -h * 0.2);
    ctx.closePath(); ctx.fill();
  }
}

function drawRam(inv) {
  const d = inv.def, w = d.w, h = d.h;
  const recoil = inv.state === "attack" ? Math.max(0, Math.sin(inv.cd * 6)) * 7 : 0;
  ctx.fillStyle = "#4a3b2e";
  for (let i = 0; i < 3; i++) {
    const px = -w * 0.16 + i * 17;
    ctx.fillRect(px - 4, -h * 0.86, 9, h * 0.52);
    ctx.beginPath(); ctx.arc(px, -h * 0.92, 6, 0, 6.284); ctx.fill();
  }
  ctx.fillStyle = d.trim; ctx.fillRect(-w / 2, -h * 0.40, w, 8);
  ctx.fillStyle = "#3d3833";
  for (const wx of [-w * 0.3, w * 0.26]) {
    ctx.beginPath(); ctx.arc(wx, -9, 11, 0, 6.284); ctx.fill();
    ctx.strokeStyle = "#6b6259"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(wx, -9, 6, 0, 6.284); ctx.stroke();
  }
  ctx.save(); ctx.translate(-recoil, 0);
  ctx.fillStyle = "#6b4f33";
  roundRect(ctx, -w * 0.6, -h * 0.62, w * 1.05, 17, 8); ctx.fill();
  ctx.fillStyle = "#8a8a90";
  roundRect(ctx, -w * 0.64, -h * 0.64, 17, 21, 5); ctx.fill();
  ctx.restore();
}

function drawCatapult(inv) {
  const d = inv.def, w = d.w, h = d.h;
  const t = clamp(1 - inv.cd / d.atkCd, 0, 1);
  const armAng = -0.5 - Math.sin(t * Math.PI) * 1.5;
  ctx.fillStyle = "#3d3833";
  for (const wx of [-w * 0.28, w * 0.28]) { ctx.beginPath(); ctx.arc(wx, -10, 12, 0, 6.284); ctx.fill(); }
  ctx.fillStyle = d.body; ctx.fillRect(-w / 2, -h * 0.46, w, 11);
  ctx.fillStyle = d.trim;
  ctx.beginPath(); ctx.moveTo(-7, -h * 0.46); ctx.lineTo(7, -h * 0.46); ctx.lineTo(0, -h * 1.0);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(0, -h * 0.96); ctx.rotate(armAng);
  ctx.fillStyle = "#6b4f33"; ctx.fillRect(-6, -4, w * 0.8, 8);
  ctx.fillStyle = "#4a4038";
  ctx.beginPath(); ctx.arc(w * 0.8, 0, 9, 0, 6.284); ctx.fill();
  ctx.restore();
}

function drawProjectile(p, alpha) {
  const x = lerp(p.px, p.x, alpha), y = lerp(p.py, p.y, alpha);
  if (p.kind === "arrow") {
    const ang = Math.atan2(p.vy, p.vx);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(US * 1.35, US * 1.35);
    ctx.strokeStyle = "rgba(255,240,200,0.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-6, 0); ctx.stroke();
    ctx.strokeStyle = "#4a3b28"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(8, 0); ctx.stroke();
    ctx.fillStyle = "#cfd4dc";
    ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(16, 0); ctx.lineTo(8, 3); ctx.closePath(); ctx.fill();
    ctx.restore();
  } else {
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.scale(US * 1.35, US * 1.35);
    ctx.fillStyle = "#75736c";
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, 6.284); ctx.fill();
    ctx.fillStyle = "#8e8c84";
    ctx.beginPath(); ctx.arc(-4, -4, 6, 0, 6.284); ctx.fill();
    ctx.restore();
  }
}

function drawParticle(p) {
  const k = 1 - p.life / p.max;
  if (p.kind === "text") {
    ctx.globalAlpha = clamp(k * 1.6, 0, 1);
    ctx.font = `700 ${p.size || 17}px system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillText(p.text, p.x + 1.5, p.y + 1.5);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  } else if (p.kind === "debris") {
    ctx.globalAlpha = clamp(k * 1.4, 0, 1);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r);
    ctx.restore();
  } else {
    ctx.globalAlpha = clamp(k * 0.55, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.6 - k * 0.6), 0, 6.284); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---- Depth-sorted scene -------------------------------------------------- */

const drawables = [];

function drawScene(alpha) {
  drawGround();

  drawables.length = 0;
  for (let gx = 0; gx < GN; gx++) for (let gy = 0; gy < GN; gy++) {
    if (isKeepTile(gx, gy) || !inBoard(gx, gy)) continue;
    if (heightAt(gx, gy)) drawables.push({ d: cellDepth(gx, gy), k: 0, gx, gy });
  }
  // Keep sits on the near corner; give it that corner's depth.
  drawables.push({ d: cellDepth(KEEP_GX0, KEEP_GY0) + (KEEP_N - 1), k: 3 });
  for (const inv of invaders) {
    if (inv.dead) continue;
    const d = depthOf(lerp(inv.pgx, inv.gx, alpha), lerp(inv.pgy, inv.gy, alpha));
    drawables.push({ d: d + 0.01, k: 1, inv });
  }
  for (const p of projectiles) drawables.push({ d: p.depth, k: 2, p });
  for (const p of particles) drawables.push({ d: p.depth, k: 4, p });

  drawables.sort((a, b) => a.d - b.d);
  for (const it of drawables) {
    if (it.k === 0) drawStack(it.gx, it.gy);
    else if (it.k === 1) drawInvader(it.inv, alpha);
    else if (it.k === 2) drawProjectile(it.p, alpha);
    else if (it.k === 3) drawKeep();
    else drawParticle(it.p);
  }
}

/* ---- Build hints --------------------------------------------------------- */

function drawBuildHints() {
  if (Game.state !== "playing" || !Pointer.active) return;
  const a = aimPoint();
  const hit = pickTile(a.x, a.y);
  if (!hit) return;
  const { gx, gy } = hit;
  const orient = orientAt(gx, gy);
  const h = slotAt(gx, gy, a.x, a.y);
  const lvl = slotHeight(gx, gy, h);
  const [px, py] = slotPlan(gx, gy, h);
  const sx = isoPX(px, py), sy = isoPY(px, py);
  const cx = isoX(gx, gy), cy = isoY(gx, gy);
  const tool = Game.tool;

  // Faint outline of the whole tile, so which tile you are on stays obvious
  // even though the brick only fills half of it.
  tileDiamond(cx, cy);
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1;
  ctx.stroke();

  if (tool === "repair" || tool === "demolish") {
    const st = slotStack(gx, gy, h);
    const top = st[st.length - 1];
    const ok = !!top && (tool === "demolish" || top.hp < top.maxHp);
    brickPath(ctx, sx, sy - lvl * ZH, orient);
    ctx.strokeStyle = ok ? (tool === "repair" ? "#8fe08a" : "#e0a06a") : "rgba(255,255,255,0.3)";
    ctx.lineWidth = 3; ctx.stroke();
    return;
  }

  const def = BRICKS[tool];
  const room = canPlace(tool, gx, gy, h);
  const afford = Game.gold >= def.cost;
  const ok = room && afford;

  // Three states, not two. "Nothing more fits here" is normal — an archer post
  // needs open sky, so the slot it sits in is full by design — and shading it
  // red made the post itself look damaged. Red is now reserved for the one
  // thing you can actually fix: not enough gold.
  if (ok) {
    ctx.globalAlpha = 0.55;
    Atlas.draw(ctx, tool, 0, 0, orient, sx - SPRITE_W / 2, sy - (lvl + 1) * ZH - SPRITE_CY);
    ctx.globalAlpha = 1;
  }
  brickPath(ctx, sx, sy - (ok ? lvl + 1 : lvl) * ZH, orient);
  ctx.strokeStyle = ok ? "#8fe08a" : afford ? "rgba(226,232,240,0.45)" : "#e0655a";
  ctx.lineWidth = ok ? 3 : 2;
  ctx.stroke();
  if (!room && !afford) { ctx.fillStyle = "rgba(210,60,50,0.18)"; ctx.fill(); }

  ctx.font = "600 17px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const label = isKeepTile(gx, gy) ? "keep"
    : !room ? (lvl >= MAXH ? "max" : "full")
    : def.cost + "g";
  const tw = ctx.measureText(label).width + 14;
  const ly = sy - (ok ? lvl + 1 : lvl) * ZH - CELL_HH - 12;
  ctx.fillStyle = "rgba(12,14,20,0.82)";
  roundRect(ctx, sx - tw / 2, ly - 10, tw, 20, 5); ctx.fill();
  ctx.fillStyle = !room ? "#aab2c0" : afford ? "#f2cf6b" : "#e0655a";
  ctx.fillText(label, sx, ly);
}

/* ---- HUD and toolbar ----------------------------------------------------- */

// The board is a rhombus, so the screen's top corners are dead space even when
// it spans the full width. Parked there rather than in the 56px HUD strip,
// which is too short to hold a 44 CSS px touch target.
const PAUSE_BTN = { x: 1004, y: 62, w: 122, h: 84 };
const PEEK_BTN  = { x: 1004, y: 154, w: 122, h: 84 };

// A compact pill floating over the board's far edge, rather than a full-width
// bar. The bar cost ~10% of the screen height in reserved space; the far edge
// is open approach ground, so the readout can simply sit on it.
function drawHud() {
  const h = 40, y = 10, padX = 13, gap = 18;
  const cy = y + h / 2;

  const goldTxt = String(Math.floor(Game.gold));
  const timeTxt = fmtTime(Game.t);
  const killTxt = String(Game.stopped);
  const barW = 96, barH = 13;

  const bigFont = "700 23px system-ui, sans-serif";
  const smallFont = "600 15px system-ui, sans-serif";
  const measure = (f, t) => { ctx.font = f; return ctx.measureText(t).width; };

  const wGold = 20 + 6 + measure(bigFont, goldTxt);
  const wKeep = barW;
  const wTime = measure(bigFont, timeTxt) + 6 + measure(smallFont, "held");
  const wKill = measure(bigFont, killTxt) + 6 + measure(smallFont, "stopped");
  const total = padX * 2 + wGold + wKeep + wTime + wKill + gap * 3;

  ctx.fillStyle = "rgba(10,12,18,0.62)";
  roundRect(ctx, 12, y, total, h, h / 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 1;
  roundRect(ctx, 12, y, total, h, h / 2); ctx.stroke();

  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  let x = 12 + padX;

  // Gold.
  ctx.fillStyle = "#f2cf6b";
  ctx.beginPath(); ctx.arc(x + 10, cy, 9, 0, 6.284); ctx.fill();
  ctx.fillStyle = "#b8952f";
  ctx.beginPath(); ctx.arc(x + 10, cy, 4.5, 0, 6.284); ctx.fill();
  ctx.font = bigFont; ctx.fillStyle = "#f6e2a8";
  ctx.fillText(goldTxt, x + 26, cy + 1);
  x += wGold + gap;

  // Keep integrity.
  const f = clamp(Game.integrity / CONFIG.keep.integrity, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  roundRect(ctx, x, cy - barH / 2, barW, barH, barH / 2); ctx.fill();
  if (f > 0.005) {
    ctx.fillStyle = f > 0.5 ? "#5fa9d8" : f > 0.25 ? "#e0bb4c" : "#d9614c";
    roundRect(ctx, x, cy - barH / 2, Math.max(barH, barW * f), barH, barH / 2); ctx.fill();
  }
  ctx.font = "700 11px system-ui, sans-serif";
  ctx.fillStyle = "#dfe6ef";
  ctx.textAlign = "center";
  ctx.fillText(Math.ceil(Game.integrity) + "%", x + barW / 2, cy + 1);
  ctx.textAlign = "left";
  x += wKeep + gap;

  // Time and kills.
  const stat = (value, label) => {
    ctx.font = bigFont; ctx.fillStyle = "#e9eef5";
    ctx.fillText(value, x, cy + 1);
    x += ctx.measureText(value).width + 6;
    ctx.font = smallFont; ctx.fillStyle = "#98a1af";
    ctx.fillText(label, x, cy + 2);
    x += ctx.measureText(label).width + gap;
  };
  stat(timeTxt, "held");
  stat(killTxt, "stopped");

  drawSideButtons();
}

function sideButton(r, active, label) {
  ctx.fillStyle = active ? "rgba(95,169,216,0.26)" : "rgba(10,12,18,0.60)";
  roundRect(ctx, r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = active ? "#7fc4ea" : "rgba(255,255,255,0.16)";
  ctx.lineWidth = active ? 3 : 1.5;
  roundRect(ctx, r.x, r.y, r.w, r.h, 10); ctx.stroke();
  ctx.fillStyle = active ? "#cfe9f7" : "#c3c9d4";
  ctx.font = "700 18px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h - 18);
}

function drawSideButtons() {
  const p = PAUSE_BTN, cxp = p.x + p.w / 2, cyp = p.y + 30;
  sideButton(p, Game.state === "paused", Game.state === "paused" ? "RESUME" : "PAUSE");
  ctx.fillStyle = Game.state === "paused" ? "#cfe9f7" : "#e9eef5";
  if (Game.state === "paused") {
    ctx.beginPath();
    ctx.moveTo(cxp - 9, cyp - 12); ctx.lineTo(cxp + 12, cyp); ctx.lineTo(cxp - 9, cyp + 12);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillRect(cxp - 11, cyp - 12, 7, 24);
    ctx.fillRect(cxp + 4, cyp - 12, 7, 24);
  }

  const k = PEEK_BTN, cxk = k.x + k.w / 2, cyk = k.y + 30;
  sideButton(k, Game.peek, "PEEK");
  ctx.strokeStyle = Game.peek ? "#cfe9f7" : "#c3c9d4";
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.ellipse(cxk, cyk, 15, 9.5, 0, 0, 6.284); ctx.stroke();
  ctx.fillStyle = Game.peek ? "#cfe9f7" : "#c3c9d4";
  ctx.beginPath(); ctx.arc(cxk, cyk, 5, 0, 6.284); ctx.fill();
}

// The palette runs down the right edge: isometric is starved of vertical room
// and flush with horizontal, so a bottom bar would cost board height we can't
// spare.
function toolbarLayout() {
  const n = TOOLS.length;
  const total = n * CONFIG.ui.btnH + (n - 1) * CONFIG.ui.btnGap;
  const y0 = 12 + (H - 24 - total) / 2;
  return TOOLS.map((t, i) => ({
    tool: t, x: CONFIG.ui.barX, w: CONFIG.ui.barW,
    y: y0 + i * (CONFIG.ui.btnH + CONFIG.ui.btnGap), h: CONFIG.ui.btnH,
  }));
}

function drawToolbar() {
  ctx.fillStyle = "rgba(10,12,18,0.72)";
  ctx.fillRect(CONFIG.ui.barX - 12, CONFIG.ui.hudH, W - CONFIG.ui.barX + 12, H - CONFIG.ui.hudH);
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  ctx.fillRect(CONFIG.ui.barX - 12, CONFIG.ui.hudH, 2, H - CONFIG.ui.hudH);

  for (const b of toolbarLayout()) {
    const id = b.tool.id;
    const sel = Game.tool === id;
    const cost = BRICKS[id] ? BRICKS[id].cost : (id === "repair" ? CONFIG.economy.repairCost : 0);
    const afford = Game.gold >= cost;

    ctx.fillStyle = sel ? "rgba(242,207,107,0.18)" : "rgba(255,255,255,0.06)";
    roundRect(ctx, b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = sel ? "#f2cf6b" : "rgba(255,255,255,0.12)";
    ctx.lineWidth = sel ? 3 : 1.5;
    roundRect(ctx, b.x, b.y, b.w, b.h, 10); ctx.stroke();

    ctx.globalAlpha = afford ? 1 : 0.42;
    const ix = b.x + 34, iy = b.y + b.h / 2;
    if (BRICKS[id]) {
      // Scaled to a readable icon regardless of how small board tiles get.
      const s = 46 / SPRITE_H;
      ctx.save();
      ctx.translate(ix, iy + SPRITE_H * s * 0.3);
      ctx.scale(s, s);
      Atlas.draw(ctx, id, 0, 1, 0, -SPRITE_W / 2, -SPRITE_CY - ZH);
      ctx.restore();
    } else if (id === "repair") {
      ctx.strokeStyle = "#8fe08a"; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(ix - 12, iy); ctx.lineTo(ix + 12, iy);
      ctx.moveTo(ix, iy - 12); ctx.lineTo(ix, iy + 12);
      ctx.stroke();
    } else {
      ctx.strokeStyle = "#e0a06a"; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(ix - 11, iy - 11); ctx.lineTo(ix + 11, iy + 11);
      ctx.moveTo(ix + 11, iy - 11); ctx.lineTo(ix - 11, iy + 11);
      ctx.stroke();
    }

    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "600 19px system-ui, sans-serif";
    ctx.fillStyle = sel ? "#f6e2a8" : "#c3c9d4";
    ctx.fillText(b.tool.label, b.x + 60, iy - 10);
    ctx.font = "700 17px system-ui, sans-serif";
    ctx.fillStyle = id === "demolish" ? "#8fe08a" : (afford ? "#f2cf6b" : "#e0655a");
    ctx.fillText(id === "demolish" ? "+50%" : cost + "g", b.x + 60, iy + 12);
    ctx.globalAlpha = 1;
  }
}

function drawBanner() {
  if (!Game.banner) return;
  const k = Game.banner.life / Game.banner.max;
  const a = k < 0.15 ? k / 0.15 : k > 0.75 ? (1 - k) / 0.25 : 1;
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.font = "700 38px Georgia, serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const cx = CONFIG.ui.barX / 2, y = 116;
  const tw = ctx.measureText(Game.banner.text).width;
  ctx.fillStyle = "rgba(120,30,30,0.78)";
  roundRect(ctx, cx - tw / 2 - 28, y - 28, tw + 56, 56, 8); ctx.fill();
  ctx.strokeStyle = "rgba(242,207,107,0.6)"; ctx.lineWidth = 2;
  roundRect(ctx, cx - tw / 2 - 28, y - 28, tw + 56, 56, 8); ctx.stroke();
  ctx.fillStyle = "#ffe9b0";
  ctx.fillText(Game.banner.text, cx, y + 2);
  ctx.globalAlpha = 1;
}

const BIG_BTN = { w: 380, h: 74 };
let bigBtnAt = null;

function drawBigButton(label, cx, cy) {
  const r = { x: cx - BIG_BTN.w / 2, y: cy - BIG_BTN.h / 2, w: BIG_BTN.w, h: BIG_BTN.h };
  bigBtnAt = r;
  ctx.fillStyle = "rgba(242,207,107,0.16)";
  roundRect(ctx, r.x, r.y, r.w, r.h, 12); ctx.fill();
  ctx.strokeStyle = "#f2cf6b"; ctx.lineWidth = 3;
  roundRect(ctx, r.x, r.y, r.w, r.h, 12); ctx.stroke();
  ctx.fillStyle = "#f6e2a8";
  ctx.font = "700 30px Georgia, serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, cx, cy + 2);
}

function drawOverlay() {
  if (Game.state === "playing") return;
  ctx.fillStyle = "rgba(6,8,14,0.80)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const cx = W / 2;

  if (Game.state === "menu") {
    ctx.fillStyle = "#f2cf6b";
    ctx.font = "700 74px Georgia, serif";
    ctx.fillText("WALL BUILDER", cx, 150);
    ctx.fillStyle = "#c3c9d4";
    ctx.font = "400 25px Georgia, serif";
    ctx.fillText("They come from two sides. Wall the ground itself.", cx, 206);

    ctx.font = "400 21px system-ui, sans-serif";
    ctx.fillStyle = "#9aa2b0";
    [
      "Tap a tile to lay a brick — bricks stack, so tap again to build higher.",
      "Invaders take the easiest route to your keep. Leave a gap and they walk through it.",
      "Seal them out completely and they smash the weakest tile instead — so thin walls invite a breach.",
      "Build tall against climbers, thick against rams, and keep archer posts off your highest ground.",
      "PEEK fades your walls so you can build on the ground they hide.",
    ].forEach((l, i) => ctx.fillText(l, cx, 276 + i * 32));

    if (Game.best > 0) {
      ctx.fillStyle = "#f2cf6b";
      ctx.font = "600 24px system-ui, sans-serif";
      ctx.fillText("Best siege held: " + Game.best, cx, 438);
    }
    drawBigButton("BEGIN THE SIEGE", cx, 528);

  } else if (Game.state === "paused") {
    ctx.fillStyle = "#e9eef5";
    ctx.font = "700 60px Georgia, serif";
    ctx.fillText("PAUSED", cx, 268);
    ctx.fillStyle = "#9aa2b0";
    ctx.font = "400 24px system-ui, sans-serif";
    ctx.fillText("The siege waits.", cx, 322);
    drawBigButton("RESUME", cx, 420);

  } else {
    ctx.fillStyle = "#d9614c";
    ctx.font = "700 66px Georgia, serif";
    ctx.fillText("THE KEEP HAS FALLEN", cx, 178);
    const s = score();
    ctx.fillStyle = "#e9eef5";
    ctx.font = "700 54px system-ui, sans-serif";
    ctx.fillText(String(s), cx, 268);
    ctx.fillStyle = "#9aa2b0";
    ctx.font = "600 22px system-ui, sans-serif";
    ctx.fillText("SCORE", cx, 308);
    ctx.font = "400 25px system-ui, sans-serif";
    ctx.fillStyle = "#c3c9d4";
    ctx.fillText(`Held for ${fmtTime(Game.t)}   ·   ${Game.stopped} stopped   ·   ${Game.breaches} got through`, cx, 366);
    ctx.font = "600 24px system-ui, sans-serif";
    ctx.fillStyle = s >= Game.best ? "#f2cf6b" : "#9aa2b0";
    ctx.fillText(s >= Game.best ? "A new best." : "Best: " + Game.best, cx, 414);
    drawBigButton("BUILD AGAIN", cx, 512);
  }
}

function render(alpha) {
  const sx = Game.shake > 0.1 ? rand(-Game.shake, Game.shake) : 0;
  const sy = Game.shake > 0.1 ? rand(-Game.shake, Game.shake) : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0b0d14";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  Viewport.applyTransform(sx, sy);

  drawBackdrop();
  drawScene(alpha);
  drawBuildHints();

  const dark = skyCache.info ? skyCache.info.dark : 0;
  if (dark > 0.01) { ctx.fillStyle = `rgba(10,14,40,${dark * 0.5})`; ctx.fillRect(0, 0, W, H); }
  if (Game.flash > 0) { ctx.fillStyle = `rgba(190,40,30,${Game.flash * 0.28})`; ctx.fillRect(0, 0, W, H); }

  bigBtnAt = null;
  drawBanner();
  drawHud();
  drawToolbar();
  drawOverlay();
}

/* ==========================================================================
   Input — Pointer Events only, so mouse / touch / stylus share one path.
   ========================================================================== */

function toolAtPoint(wx, wy) {
  for (const b of toolbarLayout()) {
    if (wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h) return b.tool.id;
  }
  return null;
}
const inRect = (wx, wy, r) => r && wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h;

// The last slot this stroke touched, so a drag never re-applies to the same one.
let strokeSlot = null;

function applyTool(wx, wy, fromDrag) {
  if (Game.state !== "playing") return;
  const hit = pickTile(wx, wy);
  if (!hit) return;
  const h = slotAt(hit.gx, hit.gy, wx, wy);
  const key = ti(hit.gx, hit.gy) * SLOTS + h;

  // A drag lays a run: every new slot it crosses gets built, with no cooldown
  // between them, because the cooldown exists to stop a frantic tap-storm, not
  // to put gaps in a deliberate line. Gold is the real limit. Re-entering the
  // slot you are already on does nothing.
  if (fromDrag) { if (key === strokeSlot) return; }
  else if (Game.buildCd > 0) return;
  strokeSlot = key;

  let acted;
  if (Game.tool === "repair") acted = repairTop(hit.gx, hit.gy, h);
  else if (Game.tool === "demolish") acted = demolishTop(hit.gx, hit.gy, h);
  else acted = placeBrick(Game.tool, hit.gx, hit.gy, h);
  if (acted && !fromDrag) Game.buildCd = CONFIG.economy.buildCooldown;
}

// Walk the line between two pointer samples. Touch move events coalesce, so a
// quick swipe reports a handful of widely spaced points — applying only at
// those would leave holes in the row.
function applyAlong(x0, y0, x1, y1) {
  const step = Math.min(CELL_HW, CELL_HH) * 0.6;
  const dist = Math.hypot(x1 - x0, y1 - y0);
  const n = Math.max(1, Math.min(64, Math.ceil(dist / step)));
  for (let i = 1; i <= n; i++) {
    applyTool(lerp(x0, x1, i / n), lerp(y0, y1, i / n), true);
  }
}

function onDown(e) {
  e.preventDefault();
  if (Pointer.id !== null && e.pointerId !== Pointer.id) return;
  Pointer.id = e.pointerId;
  Pointer.coarse = e.pointerType !== "mouse";
  const p = Viewport.toWorld(e.clientX, e.clientY);
  Pointer.x = p.x; Pointer.y = p.y;
  Pointer.down = true; Pointer.active = true;

  if (Game.state === "menu" || Game.state === "over") {
    if (inRect(p.x, p.y, bigBtnAt)) { resetGame(); Game.state = "playing"; }
    return;
  }
  if (inRect(p.x, p.y, PEEK_BTN)) { Game.peek = !Game.peek; return; }
  if (inRect(p.x, p.y, PAUSE_BTN)) {
    Game.state = Game.state === "playing" ? "paused" : "playing";
    return;
  }
  if (Game.state === "paused") { Game.state = "playing"; return; }

  const t = toolAtPoint(p.x, p.y);
  if (t) { Game.tool = t; return; }

  // Straight to where you touched. Aim-and-release tested worse on a real
  // phone than simply placing under the finger, so both pointer types now
  // build on contact and paint on drag.
  strokeSlot = null;
  applyTool(p.x, p.y);
}

function onMove(e) {
  if (Pointer.id !== null && e.pointerId !== Pointer.id && Pointer.down) return;
  const prevX = Pointer.x, prevY = Pointer.y;
  const p = Viewport.toWorld(e.clientX, e.clientY);
  Pointer.x = p.x; Pointer.y = p.y;
  Pointer.active = true;
  if (e.pointerType) Pointer.coarse = e.pointerType !== "mouse";
  if (!Pointer.down) return;
  e.preventDefault();
  if (p.x >= CONFIG.ui.barX - 12) return;   // dragging over the palette must not build
  applyAlong(prevX, prevY, p.x, p.y);
}

function onUp(e) {
  if (Pointer.id !== null && e.pointerId !== Pointer.id) return;
  Pointer.down = false; Pointer.id = null; strokeSlot = null;
  if (e.pointerType && e.pointerType !== "mouse") Pointer.active = false;
}
// The OS steals touches for system gestures; without this a half-finished drag
// would leave the pointer stuck down.
function onCancel() { Pointer.down = false; Pointer.id = null; Pointer.active = false; strokeSlot = null; }

canvas.addEventListener("pointerdown", onDown, { passive: false });
canvas.addEventListener("pointermove", onMove, { passive: false });
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onCancel);
canvas.addEventListener("pointerleave", () => { if (!Pointer.coarse) Pointer.active = false; });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

window.addEventListener("keydown", (e) => {
  if (e.key === " ") {
    e.preventDefault();
    if (Game.state === "playing") Game.state = "paused";
    else if (Game.state === "paused") Game.state = "playing";
    else { resetGame(); Game.state = "playing"; }
    return;
  }
  if (e.key === "Enter" && (Game.state === "menu" || Game.state === "over")) { resetGame(); Game.state = "playing"; return; }
  const t = TOOLS.find(t => t.key === e.key);
  if (t) Game.tool = t.id;
  if (e.key.toLowerCase() === "r") Game.tool = "repair";
  if (e.key.toLowerCase() === "v") Game.peek = !Game.peek;
});

canvas.addEventListener("mousedown", (e) => {
  if (e.button !== 2 || Game.state !== "playing") return;
  const p = Viewport.toWorld(e.clientX, e.clientY);
  const hit = pickTile(p.x, p.y);
  if (hit) demolishTop(hit.gx, hit.gy, slotAt(hit.gx, hit.gy, p.x, p.y));
});

// Phones get interrupted; coming back to a fallen keep is a bad experience.
const autoPause = () => { if (Game.state === "playing") Game.state = "paused"; };
document.addEventListener("visibilitychange", () => { if (document.hidden) autoPause(); });
window.addEventListener("blur", autoPause);
window.addEventListener("resize", () => Viewport.resize());
window.addEventListener("orientationchange", () => setTimeout(() => Viewport.resize(), 120));
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => Viewport.resize());
  window.visualViewport.addEventListener("scroll", () => Viewport.resize());
}

/* ==========================================================================
   Loop — fixed 60Hz logic with interpolated rendering.
   ========================================================================== */

const STEP = 1 / 60;
let acc = 0, last = performance.now();

function frame(now) {
  Viewport.sync();
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.25);
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 8) { update(STEP); acc -= STEP; }
  if (guard >= 8) acc = 0;

  // rAF is rescheduled at the end, so an exception here would kill the loop
  // outright and freeze on a half-drawn frame with nothing in the console.
  // Report once and keep running, so a render bug is visible instead of fatal.
  try {
    render(acc / STEP);
  } catch (err) {
    if (!frame.reported) { frame.reported = true; console.error("render failed:", err); }
  }
  requestAnimationFrame(frame);
}

Game.best = loadBest();
resetGame();
Viewport.resize();
refreshFlow();
requestAnimationFrame(frame);

/* Exposed for debugging and automated checks. */
window.__game = {
  Game, CONFIG, Viewport, BRICKS, INVADERS, GN, SLOTS, HALFW, DEPTH, inBoard,
  get stacks() { return stacks; },
  get invaders() { return invaders; },
  get projectiles() { return projectiles; },
  get particles() { return particles; },
  get flow() { return flowGround; },
  heightAt, slotHeight, slotStack, slotPlan, stackHp, placeBrick, damageBrick,
  demolishTop, repairTop, pickTile, slotAt, orientAt,
  isoX, isoY, isoPX, isoPY, planX, planY, isKeepTile, spawnInvader, score, computeFlow,
  spawnRate, unlockedTypes,
  start() { resetGame(); Game.state = "playing"; refreshFlow(); },
  fastForward(seconds) { const n = Math.floor(seconds / STEP); for (let i = 0; i < n; i++) update(STEP); },

  // Is there an open walking route from a board edge to the keep?
  routeOpen() {
    refreshFlow();
    const edges = [];
    for (let gx = 0; gx < GN; gx++) for (let gy = 0; gy < GN; gy++) {
      if (!inBoard(gx, gy)) continue;
      // A boundary tile is one with a missing orthogonal neighbour.
      if ([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => !inBoard(gx+dx, gy+dy))) edges.push([gx, gy]);
    }
    {
      for (const [ex, ey] of edges) {
        if (isKeepTile(ex, ey)) continue;
        if (heightAt(ex, ey) > 0) continue;
        if (flowGround.dist[ti(ex, ey)] < CONFIG.path.wallBase) return true;
      }
    }
    return false;
  },

  audit() {
    const problems = [];
    for (let i = 0; i < stacks.length; i++) {
      for (const b of stacks[i]) if (b.hp <= 0) problems.push(`dead brick left standing at slot ${i}`);
      if (stacks[i].length > MAXH) problems.push(`stack over max height at slot ${i}`);
    }
    for (const [kx, ky] of KEEP_TILES) if (heightAt(kx, ky) > 0) problems.push("brick built on the keep");
    if (stacks.length !== GN * GN * SLOTS) problems.push(`grid is ${stacks.length}, expected ${GN * GN * SLOTS}`);
    if (Game.gold < 0) problems.push(`negative gold: ${Game.gold}`);
    const states = new Set(["march", "wait", "attack", "fuse", "ranged"]);
    for (const inv of invaders) {
      if (!states.has(inv.state)) problems.push(`invader in unknown state ${inv.state}`);
      if (!isFinite(inv.gx) || !isFinite(inv.gy)) problems.push("invader at non-finite position");
    }
    for (const [k, n] of frontage) if (n > CONFIG.combat.frontage) problems.push(`frontage overflow on tile ${k}: ${n}`);
    return {
      ok: problems.length === 0, problems,
      counts: { invaders: invaders.length, projectiles: projectiles.length, particles: particles.length },
      tilePitchCss: +Viewport.tilePitchCss().toFixed(1),
    };
  },
};
</script>
